<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101815">
<title>客席スミ出し</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="brand-mark">▦</span><div><strong>客席スミ出し</strong><small>ARENA SEAT MARKING</small></div></div>
  <button id="saveBtn" class="header-btn">保存</button>
</header>
<main>
<section id="projectsScreen" class="screen active">
  <div class="hero"><div class="eyebrow">PROJECT</div><h1>公演データ</h1><p>公演ごとにブロック・寸法を保存して管理します。</p></div>
  <button id="newProjectBtn" class="primary full">＋ 新しい公演を作成</button>
  <div id="projectsList" class="project-list"></div>
</section>
<section id="editorScreen" class="screen">
  <div class="editor-head"><button id="backBtn" class="text-btn">‹ 公演一覧</button><button id="deleteProjectBtn" class="text-btn danger-text">公演削除</button></div>
  <div class="hero compact"><div class="eyebrow">PROJECT SETTINGS</div><h1 id="projectTitle">公演設定</h1></div>
  <div class="card">
    <label>公演名<input id="eventName" placeholder="例：Mr.Children"></label>
    <label>会場名<input id="venueName" placeholder="例：有明アリーナ"></label>
    <label>公演日<input id="eventDate" type="date"></label>
  </div>
  <div class="section-head"><div><div class="eyebrow">BLOCKS</div><h2>ブロック設定</h2></div><button id="addBlockBtn" class="small-primary">＋ ブロック追加</button></div>
  <div id="blocksEditor" class="blocks-editor"></div>
  <div class="save-row"><button id="saveProjectBtn" class="primary full">この公演を保存</button></div>
  <div class="section-head"><div><div class="eyebrow">WORK MODE</div><h2>スミ出し作業</h2></div></div>
  <div id="workBlocks" class="work-blocks"></div>
</section>
<section id="workScreen" class="screen">
  <div class="editor-head"><button id="workBackBtn" class="text-btn">‹ 設定に戻る</button><button id="listToggle" class="text-btn">寸法一覧</button></div>
  <div class="work-title"><div class="eyebrow" id="workProjectLabel"></div><h1 id="workBlockLabel">Aブロック</h1></div>
  <div class="mode-switch"><button id="forwardMode" class="mode-btn active">正順 1 → 最終列</button><button id="reverseMode" class="mode-btn">逆順 最終列 → 1</button></div>
  <div class="dimension-card">
    <div class="row-label"><span id="currentRowLabel">1列目</span><span id="rowProgress">1 / 20</span></div>
    <div id="currentDimension" class="big-number">1,000<span>mm</span></div>
    <div id="previousPitch" class="pitch-caption">開始寸法</div>
    <div class="dimension-subgrid"><div><small>椅子前端</small><strong id="chairFront">1,000 mm</strong></div><div><small>椅子後端</small><strong id="chairRear">1,450 mm</strong></div></div>
    <div class="progress-track"><div id="progressFill"></div></div>
  </div>
  <div class="navigation"><button id="prevRow" class="nav-btn secondary">‹ 前の列</button><button id="nextRow" class="nav-btn primary">次の列 ›</button></div>
  <div class="jump-row"><button id="firstRow" class="outline-btn">最初へ</button><button id="lastRow" class="outline-btn">最後へ</button></div>
  <div id="dimensionsList" class="dimensions-list hidden"></div>
  <div class="bottom-work"><button id="changeBlockBtn" class="outline-btn full">ブロック切替</button></div>
</section>
</main>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
